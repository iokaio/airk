# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.8.34"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iokaio/airk"
publish = false

[workspace.dependencies]
airk-core = { path = "crates/airk-core" }
airk-ipc = { path = "crates/airk-ipc" }
airk-process = { path = "crates/airk-process" }
airk-ingest = { path = "crates/airk-ingest" }
airk-store = { path = "crates/airk-store" }
airk-retrieval = { path = "crates/airk-retrieval", default-features = false }
airk-kernel = { path = "crates/airk-kernel", default-features = false }
airk-mcp = { path = "crates/airk-mcp" }
airk-service = { path = "crates/airk-service" }
airk-https = { path = "crates/airk-https" }
airk-frontend = { path = "crates/airk-frontend" }
airk-supervisor = { path = "crates/airk-supervisor" }
airk-installer = { path = "crates/airk-installer" }
airk-catalog-control = { path = "crates/airk-catalog-control" }
airk-inference = { path = "crates/airk-inference" }
airk-endpoint = { path = "crates/airk-endpoint" }
airk-host = { path = "crates/airk-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4.33"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tower-service = "=0.3.3"
tokio-util = { version = "=0.7.19", features = ["rt"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
ring = "=0.17.14"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = { version = "=0.18.1", default-features = false }
subtle = "=2.6.1"
time = "=0.3.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
# SQLite 3.53.3 includes a4691489f21b: extended local Windows paths must not
# use UNC shared-memory locking. Registry 0.40.2 still bundles SQLite 3.53.2.
# Pin the upstream bundle update until a fixed registry release is available.
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "2a71e35d94b2a02f7dd4a0c4cfd59c339370e747", features = ["bundled", "hooks", "limits", "blob"] }
scip = "=0.10.0"
protobuf = "=3.7.2"
url = "2"
sha2 = "0.10"
lz4_flex = { version = "=0.13.1", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
getrandom = "=0.3.4"
tempfile = "3"
diskann = { version = "=0.59.0", default-features = false }
diskann-vector = "=0.59.0"
futures = "0.3"
notify = "=8.2.0"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
libc = "=0.2.190"
windows-sys = "=0.61.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "time"] }

# Keep routine local builds small on Windows, macOS and Linux. Enable debug
# information explicitly for a debugger session; release settings stay separate.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

# Local installer builds on a developer machine only
# (`scripts/build-local-service-installer.py`). Published releases are built
# in CI with `[profile.release]` above; this profile trades a little runtime
# optimization for parallel code generation in the long serial crate chain.
[profile.release-local]
inherits = "release"
codegen-units = 16

# Integration fixtures authenticate full native images and model assets. Keep
# their hashing representative of release builds without extending deadlines.
[profile.dev.package.sha2]
opt-level = 3
