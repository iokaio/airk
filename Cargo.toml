# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.2.3"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/iokaio/airk"
publish = false

[workspace.dependencies]
airk-core = { path = "crates/airk-core" }
airk-ingest = { path = "crates/airk-ingest" }
airk-store = { path = "crates/airk-store" }
airk-retrieval = { path = "crates/airk-retrieval" }
airk-kernel = { path = "crates/airk-kernel" }
airk-mcp = { path = "crates/airk-mcp" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite 3.53.3 includes a4691489f21b: extended local Windows paths must not
# use UNC shared-memory locking. Registry 0.40.2 still bundles SQLite 3.53.2.
# Pin the upstream bundle update until a fixed registry release is available.
rusqlite = { git = "https://github.com/rusqlite/rusqlite", rev = "2a71e35d94b2a02f7dd4a0c4cfd59c339370e747", features = ["bundled", "hooks"] }
scip = "=0.10.0"
protobuf = "=3.7.2"
url = "2"
sha2 = "0.10"
lz4_flex = { version = "=0.13.1", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
getrandom = "=0.3.4"
tempfile = "3"
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
diskann = { version = "=0.59.0", default-features = false }
diskann-vector = "=0.59.0"
futures = "0.3"
notify = "=8.2.0"
tract-onnx = { version = "=0.23.8", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
libc = "=0.2.190"
windows-sys = "=0.61.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal", "time"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
