<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 668" width="780" height="668" role="img" aria-label="Flow of the prototype Gather Context loop. The caller's task, needs and anchors are fetched for, judged twice by one model and followed up for more rounds. Then each need is checked. A strong need goes straight to delivery. A weak need gets a second fetch and a larger share of the reply.">
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .ground { fill: #10181d; }
    .box { fill: #18232a; stroke: #e4ecef; stroke-width: 1.2; }
    .model { fill: #173a40; stroke: #5cc4cf; stroke-width: 1.4; }
    .weakbox { fill: #3d2c12; stroke: #f0aa4d; stroke-width: 1.4; }
    .t { fill: #e4ecef; font-size: 13px; font-weight: 600; }
    .s { fill: #9bacb5; font-size: 11.5px; }
    .wl { fill: #f0aa4d; font-size: 11.5px; font-weight: 600; }
    .al { fill: #9bacb5; font-size: 11px; }
    .flow { stroke: #e4ecef; stroke-width: 1.3; fill: none; }
    .wflow { stroke: #f0aa4d; stroke-width: 1.5; fill: none; }
    .head { fill: #e4ecef; }
    .whead { fill: #f0aa4d; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="whead" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="ground" x="0" y="0" width="780" height="668"/>

  <rect class="box" x="30" y="14" width="340" height="62" rx="4"/>
  <text class="t" x="46" y="38">Caller sends one request</text>
  <text class="s" x="46" y="57">task · up to 8 needs · up to 16 anchors</text>

  <line class="flow" x1="200" y1="76" x2="200" y2="104" marker-end="url(#a)"/>
  <rect class="box" x="30" y="106" width="340" height="62" rx="4"/>
  <text class="t" x="46" y="130">1 · Fetch candidates</text>
  <text class="s" x="46" y="149">one search per need, per anchor, and for the task</text>

  <line class="flow" x1="200" y1="168" x2="200" y2="196" marker-end="url(#a)"/>
  <rect class="model" x="30" y="198" width="340" height="78" rx="4"/>
  <text class="t" x="46" y="222">2 · Judge each need against its candidates</text>
  <text class="s" x="46" y="241">first: is this passage relevant to the need?</text>
  <text class="s" x="46" y="258">second, stricter: must a developer read it?</text>

  <line class="flow" x1="200" y1="276" x2="200" y2="304" marker-end="url(#a)"/>
  <rect class="box" x="30" y="306" width="340" height="94" rx="4"/>
  <text class="t" x="46" y="330">3 · Follow up, round one: every need</text>
  <text class="s" x="46" y="349">project rule files and neighbouring files</text>
  <text class="s" x="46" y="366">read around each need's best passages</text>
  <text class="s" x="46" y="383">look up the names the model picks</text>

  <path class="flow" d="M370 353 H410 V237 H372" marker-end="url(#a)"/>
  <text class="al" x="416" y="290">judge the</text>
  <text class="al" x="416" y="304">new passages</text>

  <line class="flow" x1="200" y1="400" x2="200" y2="428" marker-end="url(#a)"/>
  <rect class="box" x="30" y="430" width="340" height="62" rx="4"/>
  <text class="t" x="46" y="454">4 · Later rounds: open needs only</text>
  <text class="s" x="46" y="473">a need with a strong passage stops fetching</text>

  <line class="flow" x1="200" y1="492" x2="200" y2="520" marker-end="url(#a)"/>
  <rect class="model" x="30" y="522" width="340" height="62" rx="4"/>
  <text class="t" x="46" y="546">5 · Is each need's evidence weak?</text>
  <text class="s" x="46" y="565">checked need by need, with a reason</text>

  <line class="flow" x1="200" y1="584" x2="200" y2="612" marker-end="url(#a)"/>
  <text class="al" x="208" y="602">strong</text>
  <rect class="box" x="30" y="614" width="340" height="44" rx="4"/>
  <text class="t" x="46" y="641">6 · Deliver: best passages per need, one byte budget</text>

  <line class="wflow" x1="370" y1="553" x2="466" y2="553" marker-end="url(#aw)"/>
  <text class="wl" x="398" y="545">weak</text>

  <rect class="weakbox" x="468" y="392" width="296" height="118" rx="4"/>
  <text class="t" x="484" y="416">Weak when any of these holds</text>
  <text class="s" x="484" y="437">best passage scores below 0.5</text>
  <text class="s" x="484" y="455">only one passage of any strength</text>
  <text class="s" x="484" y="473">best passage scores near zero</text>
  <text class="s" x="484" y="490">against the task as a whole</text>

  <rect class="weakbox" x="468" y="522" width="296" height="62" rx="4"/>
  <text class="t" x="484" y="546">Second, different fetch</text>
  <text class="s" x="484" y="565">need + task · each clause · exact names · 2× width</text>

  <line class="wflow" x1="616" y1="510" x2="616" y2="520"/>
  <path class="wflow" d="M616 584 V636 H372" marker-end="url(#aw)"/>
  <text class="wl" x="470" y="604">measured twice: no gain</text>
  <text class="wl" x="470" y="628">keeps 3+ passages, double share,</text>
  <text class="wl" x="470" y="652">reply names the reason</text>
</svg>
