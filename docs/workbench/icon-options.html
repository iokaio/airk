<!doctype html>

<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRK Workbench — original icon directions</title>
<style>
:root{color-scheme:dark;--bg:#171b20;--surface:#20262d;--text:#f2f0e9;--muted:#b2b8be;--gold:#dfc48b;--border:#46515b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:32px}header{display:flex;align-items:center;gap:14px}h1{font-size:25px;margin:0;font-weight:550}p{color:var(--muted);margin:6px 0 22px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.option{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.option.selected{border:2px solid var(--gold);padding:21px}.option h2{font-size:21px;margin:0 0 8px}.note{height:75px;font-size:14px}.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px;padding:20px 0 28px}.sample{text-align:center;color:var(--muted);font-size:12px}.sample button,.bar button,.foot button{display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:8px;width:40px;height:40px;color:var(--text)}.sample button{display:flex;margin:0 auto 7px;width:46px;height:46px}.sample button:hover,.bar button:hover,.foot button:hover{background:#ffffff12}svg{width:24px;height:24px}.mock{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--bg);height:280px;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:2px}.bar span{flex:1;font-size:13px;padding-left:5px}.empty{flex:1;display:grid;place-content:center;color:var(--muted);text-align:center;font-size:13px}.empty strong{font-size:17px;color:var(--text);font-weight:500}.composer{border:1px solid var(--border);border-radius:12px;padding:10px}.placeholder{font-size:12px;color:var(--muted);margin:0 0 12px}.foot{display:flex;align-items:center;gap:5px}.foot small{flex:1;font-size:10px;color:var(--muted);line-height:1.3}.foot button{width:28px;height:28px}.foot .add{width:34px;height:34px}.choose{width:100%;margin-top:20px;border:1px solid var(--gold);border-radius:8px;padding:10px;background:transparent;color:var(--gold)}.selected .choose{background:var(--gold);color:#112e3c}.accent{stroke:var(--gold)}.Beacon .sample button,.Beacon .bar button,.Beacon .foot button{background:#112e3c}.Beacon svg{stroke-width:2.1}.Orbit svg{stroke-linecap:round;stroke-linejoin:round}.Facet svg{stroke-linecap:square;stroke-linejoin:miter}.status{min-height:24px;margin:18px 0 0}.theme{margin-left:auto;background:transparent;border:1px solid var(--border);padding:8px 12px;border-radius:8px}.light{color-scheme:light;--bg:#f8f7f3;--surface:#fff;--text:#112e3c;--muted:#53616c;--gold:#98743a;--border:#ccd2d6}.light .Beacon button svg{color:#faf9f5;--gold:#dfc48b}@media(max-width:900px){.grid{grid-template-columns:1fr}.note{height:auto}body{padding:20px}.mock{height:260px}}
</style>
<header><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2.5 19 6-14 6 14M5 13.5h7"/><path class="accent" d="m17 7 5 5-5 5"/></svg><h1>Three AIRK icon directions</h1><button class="theme" onclick="document.body.classList.toggle('light')">Light / dark</button></header><p>Original vector studies built around AIRK’s angular A, forward chevron and navy / warm gold palette. Click a style to compare it in context.</p><div class="grid" id="options"></div><p class="status" id="selection" role="status">Choose a style to highlight it. These controls are a local design preview.</p>
<script>
const families={"Facet": {"note": "Angular outlines and small gold chevrons echo AIRK’s A-shaped geometry.", "plus": "M12 4v16M4 12h16", "history": "M5 7 9 3h7l5 5v8l-5 5H8l-5-5M3 6v6h6M12 7v5l4 2", "settings": "M3 6h18M3 12h18M3 18h18M7 3l3 3-3 3-3-3zM17 9l3 3-3 3-3-3zM9 15l3 3-3 3-3-3z", "new": "M4 21V7l4-4h8l4 4v14zM9 12h6M12 9v6", "send": "m6 5 7 7-7 7m7-14 7 7-7 7", "stop": "M7 4h10l3 3v10l-3 3H7l-3-3V7z"}, "Orbit": {"note": "Open rings and an upward A-shaped arrow keep the controls light and spacious.", "plus": "M12 5v14M5 12h14", "history": "M4 8a9 9 0 1 1 0 8M2 3v6h6M12 7v5l3 2", "settings": "M4 7h16M4 17h16M8 4v6M16 14v6", "new": "M15 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-8M16 2v7h7M8 14h8M12 10v8", "send": "M5 19 12 4l7 15M8 14h8M12 5v15", "stop": "M8 5h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"}, "Beacon": {"note": "Stronger strokes, navy tiles and warm gold details give AIRK a distinct branded presence.", "plus": "M12 5v14M5 12h14", "history": "M5 6h11l4 4v9H6l-3-3V9M3 3v6h6M12 8v5h4", "settings": "M4 5h16M4 12h16M4 19h16M8 3v4M16 10v4M9 17v4", "new": "M5 21V3h10l5 5v13zM15 3v6h5M9 14h7M12.5 10.5v7", "send": "M5 4 21 12 5 20l4-8zM10 12h10", "stop": "M6 6h12v12H6z"}};
const labels={plus:'Add menu',history:'History',settings:'Settings',new:'New session',send:'Run request',stop:'Stop'};
function icon(name,family){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${families[family][name]}"/><path class="accent" d="${name==='send'?'m17 9 3 3-3 3':'m19 3 2 2-2 2'}"/></svg>`}
function button(name,family,extra=''){return `<button title="${labels[name]}" aria-label="${labels[name]}" class="${extra}">${icon(name,family)}</button>`}
document.querySelector('#options').innerHTML=Object.entries(families).map(([name,f],i)=>`<section class="option ${name}" id="${name}"><h2>${i+1}. ${name}</h2><p class="note">${f.note}</p><div class="icons">${Object.keys(labels).map(key=>`<div class="sample">${button(key,name)}${labels[key]}</div>`).join('')}</div><div class="mock"><div class="bar"><span>airk ▾</span>${button('history',name)}${button('settings',name)}${button('new',name)}</div><div class="empty"><strong>Explore your project</strong><span>Collect cited evidence locally</span></div><div class="composer"><p class="placeholder">Ask about this project, or type /</p><div class="foot">${button('plus',name,'add')}<small>Local index · Read-only<br>(no generative AI used in AIRK Workbench)</small>${button('send',name)}</div></div></div><button class="choose" onclick="choose('${name}')">Choose ${name}</button></section>`).join('');
function choose(name){document.querySelectorAll('.option').forEach(el=>{el.classList.toggle('selected',el.id===name);el.querySelector('.choose').setAttribute('aria-pressed',String(el.id===name))});document.querySelector('#selection').textContent=`Selected: ${name}. Tell Codex this name to apply it to Workbench.`}
</script></html>
