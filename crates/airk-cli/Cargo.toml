# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-cli"
description = "Airk command-line interface and MCP entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["local-inference", "bundled-model"]
local-inference = ["airk-kernel/local-inference", "airk-retrieval/local-inference"]
bundled-model = []
embedding-worker = ["local-inference", "bundled-model"]

[[bin]]
name = "airk"
path = "src/main.rs"

[[bin]]
name = "airk-embed"
path = "src/embed_main.rs"
required-features = ["embedding-worker"]

[dependencies]
airk-core.workspace = true
airk-kernel.workspace = true
airk-mcp.workspace = true
airk-retrieval = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
sha2.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
airk-store.workspace = true
