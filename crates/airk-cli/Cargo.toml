# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-cli"
description = "Airk command-line interface and MCP entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
local-inference = ["airk-kernel/local-inference", "airk-retrieval/local-inference"]
bundled-model = []
embedding-worker = ["local-inference", "bundled-model"]
parser-training = []

[[bin]]
name = "airk"
path = "src/main.rs"

[[bin]]
name = "airk-embed"
path = "src/embed_main.rs"
required-features = ["embedding-worker"]

# An explicit instrumented qualification image, never a default test run,
# cargo-install executable, or release runtime payload.
[[test]]
name = "guarded_provider_fixture"
path = "tests/fixtures/guarded_provider_fixture.rs"
harness = false
test = false
bench = false
required-features = ["embedding-worker"]

[dependencies]
airk-core.workspace = true
airk-process.workspace = true
airk-kernel.workspace = true
airk-mcp.workspace = true
airk-store.workspace = true
airk-retrieval = { workspace = true, default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
tempfile.workspace = true
sha2.workspace = true

[dev-dependencies]
airk-ingest.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Com"] }

[build-dependencies]
cc = "=1.2.67"
serde_json.workspace = true
sha2.workspace = true
