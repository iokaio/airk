# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-retrieval"
description = "Deterministic lexical candidates and bounded evidence responses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["local-inference"]
local-inference = ["dep:ort", "dep:tokenizers"]
test-support = []
# One static CUDA-capable ORT core; optional providers remain unloaded for CPU.
gpu-cuda = ["local-inference", "ort/cuda", "dep:windows-sys"]

[dependencies]
airk-core.workspace = true
airk-process.workspace = true
anyhow.workspace = true
diskann.workspace = true
diskann-vector.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

# Actual service-lease ownership for native component qualification only.
[dev-dependencies]
airk-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }
