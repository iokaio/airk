# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-process"
description = "Owned native process containment and confirmed descendant cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# U90: issuer PEM parsing, receipt serde and DER digests; already in the
# graph (airk-cli) at these versions and feature sets.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# WinTrust and Cryptography (+ Catalog/Sip for the WTHelper provider-state
# readers): Authenticode verification of the installed pair (step 3b.1c-sig).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }

[dev-dependencies]
tempfile.workspace = true
