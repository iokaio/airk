[package]
name = "airk-mcp"
description = "Read-only stdio MCP tools over the Airk kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
local-inference = ["airk-kernel/local-inference"]
test-support = ["airk-kernel/test-support"]

[dependencies]
airk-core.workspace = true
airk-kernel.workspace = true
anyhow.workspace = true
regex = "=1.13.1"
rmcp = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
tower-service.workspace = true
tokio-util.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
