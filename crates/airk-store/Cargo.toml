# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-store"
description = "Memory and atomic local-file snapshot adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
airk-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tempfile.workspace = true
serde.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
sha2.workspace = true
lz4_flex.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
airk-process.workspace = true
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_System_IO", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization"] }
