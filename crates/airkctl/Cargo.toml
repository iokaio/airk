# SPDX-License-Identifier: Apache-2.0
[package]
name = "airkctl"
description = "The AIRK command-line client; reaches the AIRK service only through its local control endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Split plan U27: airkctl depends only on airk-core, airk-process and airk-ipc.
# The edge gate (scripts/dev/boundary-exceptions.json) enforces the list.
[dependencies]
airk-core.workspace = true
airk-ipc.workspace = true
# U84: the native per-user folders for the install pointer.
airk-process.workspace = true
# Already in the dependency graph (airk-cli) at this version and feature set.
anyhow.workspace = true
clap.workspace = true
# Start-request nonces; already in the graph (airk-kernel) at this version.
getrandom.workspace = true
# No-clobber file capture for `service logs --output-file`; already in the graph.
tempfile.workspace = true
# Already in the dependency graph through rmcp at this version and feature set
# (split plan U47 pilot); no new third-party identity.
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The I1 client is async (airk-ipc); one current-thread runtime per command.
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "airkctl"
path = "src/main.rs"
