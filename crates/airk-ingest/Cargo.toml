# SPDX-License-Identifier: Apache-2.0
[package]
name = "airk-ingest"
description = "Bounded workspace discovery and deterministic text extraction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
airk-core.workspace = true
airk-process.workspace = true
anyhow.workspace = true
ignore.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
scip.workspace = true
protobuf.workspace = true
url.workspace = true
tempfile.workspace = true
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.25.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-lua = "=0.5.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-json = "=0.24.8"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-scss = { package = "cortexkit-tree-sitter-scss", version = "=1.0.1" }
tree-sitter-razor = "=0.1.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-scala = "=0.25.1"
tree-sitter-elixir = "=0.3.5"
tree-sitter-objc = "=3.0.2"
tree-sitter-fortran = "=0.6.0"
tree-sitter-pascal = "=0.10.2"
tree-sitter-cobol = { package = "arborium-cobol", version = "=2.18.2" }
tree-sitter-sfapex = "=2.4.0"
tree-sitter-solidity = "=1.2.13"
tree-sitter-vhdl = "=1.4.0"
tree-sitter-verilog = "=1.0.3"
tree-sitter-cuda = "=0.21.1"
tree-sitter-wgsl = { package = "tree-sitter-wgsl-bevy", version = "=0.1.4" }
tree-sitter-glsl = "=0.2.0"
tree-sitter-asm = "=0.24.0"
tree-sitter-r = "=1.3.0"
tree-sitter-perl = { package = "ts-parser-perl", version = "=2.0.0" }
tree-sitter-groovy = { package = "dekobon-tree-sitter-groovy", version = "=0.3.0" }
tree-sitter-nix = "=0.3.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-julia = "=0.23.1"
tree-sitter-clojure = "=0.1.0"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-haskell = "=0.24.1"
tree-sitter-erlang = "=0.21.0"
tree-sitter-fsharp = "=0.3.12"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-hcl = "=1.1.0"
tree-sitter-dockerfile-updated = "=0.2.0"
tree-sitter-proto = "=0.4.0"
tree-sitter-graphql = "=0.1.0"
tree-sitter-cmake = "=0.7.1"
tree-sitter-make = "=1.1.1"
quick-xml = "0.39"
zip = { version = "4", default-features = false, features = ["deflate"] }
pdf-extract = "=0.12.1"
csv = "1"
pulldown-cmark = { version = "0.10", default-features = false }
regex = "=1.13.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
