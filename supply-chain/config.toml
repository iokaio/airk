
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/b112f2f24a58492c45cd958c2a8aa986df9e0634/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/8cec794c38751495cf7a6c083220c207af1303d6/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/4716047f88d72d0685224af330bf21d0c2435b69/audits.toml"

[policy.libsqlite3-sys]
audit-as-crates-io = true
notes = "Treat this upstream Git fork as third-party. Its exact existing Git revision is explicitly exempted, not covered by a crates.io audit; new revisions require a genuine delta audit or reviewed exception plus source-policy update."

[policy.rusqlite]
audit-as-crates-io = true
notes = "Treat this upstream Git fork as third-party. Its exact existing Git revision is explicitly exempted, not covered by a crates.io audit; new revisions require a genuine delta audit or reviewed exception plus source-policy update."

