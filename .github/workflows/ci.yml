# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-natural-exit-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-proof:
    name: Mac regression proof / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            jobs: 2
          - os: macos-15-intel
            target: x86_64-apple-darwin
            jobs: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      AIRK_PROCESS_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 8
        with:
          shared-key: native-${{ matrix.target }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: 'false'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.148
      - name: Natural exit and descendant ownership regressions
        run: cargo nextest run --profile ci -p airk-process --locked --target ${{ matrix.target }}
      - name: Repeat the exit versus signal transition
        run: |
          for attempt in {1..20}; do
            cargo nextest run --profile ci -p airk-process --locked --target ${{ matrix.target }} -E 'test(timeout_retains_unreaped_leader_for_later_drain) | test(naturally_exited_children_drain_without_signaling_an_empty_group)'
          done
      - name: Previously hanging manager, legacy, PDF and guardian cases
        run: cargo nextest run --profile ci -p airk-cli --lib --test legacy_native --test pdf_worker --test unix_guardian -E 'test(manager_command_deadline_covers_blocked_stdin_and_output_is_not_silently_truncated) | test(legacy_review_never_executes_the_selected_old_binary_or_creates_project_state) | test(distributed_cli_indexes_pdf_in_its_worker_and_preserves_source_locations) | test(guardian_keeps_direct_pipes_and_drains_after_worker_death)' --locked --target ${{ matrix.target }}
