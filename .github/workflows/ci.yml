# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Disable native and container cache restores for a cold qualification build
        type: boolean
        default: false
      qualification:
        description: Also run the full workspace on every OS, container tests and native lifecycle campaigns
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      expected_version:
        type: string
        default: ''
      fresh_build:
        type: boolean
        default: false
      qualification:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '13.3'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      native: ${{ steps.plan.outputs.native }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      promoted: ${{ steps.plan.outputs.promoted }}
      container: ${{ steps.plan.outputs.container }}
      extension: ${{ steps.plan.outputs.extension }}
      contracts: ${{ steps.plan.outputs.contracts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks and promote the merged PR's identical-tree candidate on main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_QUALIFICATION: ${{ inputs.qualification }}
        run: python scripts/ci-plan.py plan --promotion artifacts/promotion
      - name: Retain the verified promotion record
        if: ${{ steps.plan.outputs.promoted == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-promotion-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/promotion/promotion.json
          if-no-files-found: error
          retention-days: 7
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify native, extension and lockfile version agreement
        env:
          AIRK_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: python scripts/release-version.py check
      - run: cargo fmt --all --check
      - run: python -m unittest discover -s scripts/tests -p test_ci_plan.py -v
      - name: Validate workflows with digest-pinned actionlint
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Public files, documentation links and contributor guidance
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - name: Boundary gates and documentation archive
        run: |
          python scripts/dev/boundary_check.py
          python scripts/dev/d6_archive_docs.py --check
      - run: git diff --check
  contracts:
    name: Contracts / ${{ matrix.os }}
    needs: [plan, quick]
    if: needs.plan.outputs.contracts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v
  extension:
    needs: [plan, quick]
    if: needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: npm test --prefix packages/vscode
      - name: Verify compiled extension staging and listing contracts
        run: python -m unittest discover -s scripts/tests -p test_package_extension.py -v
      # The UI-only universal VSIX (U29) needs no native artifact; it branches after the
      # extension's own compilation (split §10.5.3) and never waits for native-build.
      - name: Package and verify the universal UI-only VSIX
        env:
          AIRK_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: python scripts/package-extension.py --channel "$AIRK_CHANNEL"
      # TODO(split 10.5.2): scripts/ci-candidates.py select_artifacts/promote/release-inputs still
      # expect per-target airk-vsix-<target>-... artifacts; switch them to this single
      # airk-vsix-universal-<commit>-<run>-<attempt> artifact (split_receipts.catalog_names).
      # Until then main promotion falls back to the complete build.
      - name: Retain the universal extension and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-vsix-universal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extension/universal/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  native-build:
    needs: [plan, quick, contracts, extension]
    if: ${{ !cancelled() && needs.plan.outputs.native == 'true' && needs.quick.result == 'success' && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') && (needs.extension.result == 'success' || needs.extension.result == 'skipped') }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
      NEXTEST_TEST_THREADS: ${{ matrix.test_threads }}
      # Test images retain symbols/backtraces but omit costly DWARF/PDB data.
      # These settings do not change the release profile or shipped payloads.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      AIRK_QUALIFICATION: ${{ inputs.qualification || false }}
    permissions:
      contents: read
      actions: read
    name: Native build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 4
      # PRs: Linux, Windows and Apple Silicon. Promoted main: macOS Intel only.
      # Other main, manual and qualification builds: all four (scripts/ci-plan.py).
      matrix: ${{ fromJSON(needs.plan.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 90 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Reuse a successful build from this exact run when rerunning validation
        id: resume
        if: ${{ !inputs.fresh_build }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-runtime.py resume --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }} --transfer artifacts/runtime-transfer/${{ matrix.target }}
      - name: Install pinned compiler and checks
        if: steps.resume.outputs.restored != 'true'
        run: rustup show
      - name: Restore dependency compiler cache
        if: ${{ !inputs.fresh_build && steps.resume.outputs.restored != 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        timeout-minutes: 8
        with:
          shared-key: native-${{ matrix.target }}-debug0-${{ hashFiles('scripts/provision-static-onnx-runtime.py', 'scripts/static-onnx-runtime-lock.json', 'scripts/provision-static-onnx-tools.py', 'scripts/static-onnx-tools-lock.json', 'scripts/static-onnx-link-closure.py') }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned process-isolated test runner
        if: steps.resume.outputs.restored != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.resume.outputs.restored != 'true'
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      # Build order (split §10.5.3): admin bundle check/seal before any native compilation;
      # `airk` embeds crates/airk-cli/admin-assets and a stale bundle must stop the build.
      - name: Check the locked admin bundle before the native build
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/build-admin-assets.py --output artifacts/admin/admin-assets.json
      - name: Record runner capacity before native compilation
        run: python scripts/ci-diagnostics.py --output artifacts/ci/runner-before.json
      - name: Prepare pinned bundled model build inputs
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/provision-local-model.py --destination target/local-vector-model --download
      - name: Prepare pinned static CPU inference inputs
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/provision-static-onnx-runtime.py --destination target/static-onnx-runtime/${{ matrix.target }} --target ${{ matrix.target }} --download --download-tools --build --parallel 2 --github-env
      - name: Verify native child ownership before workspace qualification
        if: steps.resume.outputs.restored != 'true'
        run: cargo nextest run --profile ci -p airk-process --locked --target ${{ matrix.target }}
      - name: Compile the separate lightweight CLI component configuration
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/ci-metrics.py run --name lightweight-component-compile -- cargo check -p airk-cli --no-default-features --all-targets --locked --target ${{ matrix.target }}
      - name: Prove the airkctl CLI carries no inference dependency
        if: steps.resume.outputs.restored != 'true'
        shell: bash
        # Write the tree first so a failing cargo tree cannot hide inside the grep condition.
        run: |
          cargo tree --locked -p airkctl --target ${{ matrix.target }} --edges normal --prefix none --format '{p}' > "$RUNNER_TEMP/airkctl-dependencies.txt"
          test -s "$RUNNER_TEMP/airkctl-dependencies.txt"
          if awk '{print $1}' "$RUNNER_TEMP/airkctl-dependencies.txt" | grep -Ex 'ort|ort-sys|tokenizers|tract-.*'; then
            echo "::error::airkctl depends on an inference crate"
            exit 1
          fi
      - name: airkctl unit and contract tests
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/ci-metrics.py run --name airkctl-tests -- cargo nextest run --profile ci -p airkctl --locked --target ${{ matrix.target }}
      - name: Clippy for the airkctl CLI on hosts without workspace Clippy
        if: ${{ steps.resume.outputs.restored != 'true' && matrix.os != 'ubuntu-24.04' && !inputs.qualification }}
        run: python scripts/ci-metrics.py run --name airkctl-clippy -- cargo clippy -p airkctl --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Native platform ownership and retrieval regressions
        if: ${{ steps.resume.outputs.restored != 'true' && matrix.os != 'ubuntu-24.04' && !inputs.qualification }}
        env:
          AIRK_PROCESS_DIAGNOSTICS: '1'
        run: python scripts/ci-metrics.py run --name platform-regressions -- cargo nextest run --profile ci --test-threads 2 -p airk-cli --no-default-features --features local-inference --lib --test native_read_retry --test legacy_native --test pdf_worker --test unix_guardian --test native_worker_storage --test combined_reads --test explorer_assistance --locked --target ${{ matrix.target }}
      - name: Clippy for this native platform
        if: ${{ steps.resume.outputs.restored != 'true' && (matrix.os == 'ubuntu-24.04' || inputs.qualification) }}
        run: python scripts/ci-metrics.py run --name clippy -- cargo clippy --workspace --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings
      - name: Compile workspace tests
        if: ${{ steps.resume.outputs.restored != 'true' && (matrix.os == 'ubuntu-24.04' || inputs.qualification) }}
        run: python scripts/ci-metrics.py run --name test-compile -- cargo nextest run --profile ci --workspace --all-features --locked --target ${{ matrix.target }} --no-run
      - name: Run isolated workspace tests
        if: ${{ steps.resume.outputs.restored != 'true' && (matrix.os == 'ubuntu-24.04' || inputs.qualification) }}
        run: python scripts/ci-metrics.py run --name test-execution -- cargo nextest run --profile ci --workspace --all-features --locked --target ${{ matrix.target }} ${{ inputs.qualification && '--ignore-default-filter' || '' }}
      - name: Run documentation tests
        if: ${{ steps.resume.outputs.restored != 'true' && (matrix.os == 'ubuntu-24.04' || inputs.qualification) }}
        run: python scripts/ci-metrics.py run --name doctests -- cargo test --doc --workspace --locked --target ${{ matrix.target }}
      - name: Kernel real-model cache and incremental-work regressions
        if: ${{ steps.resume.outputs.restored != 'true' && inputs.qualification }}
        env:
          AIRK_TEST_MODEL_DIR: ${{ github.workspace }}/target/local-vector-model/${{ startsWith(matrix.target, 'aarch64-') && 'minilm-l6-v2-s8-v1' || 'minilm-l6-v2-u8-v1' }}
        run: cargo test -p airk-kernel --features local-inference --test vector_performance --locked --target ${{ matrix.target }} -- --ignored --test-threads=1
      - name: Build pinned native candidate
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/ci-metrics.py run --name release-runtime -- python scripts/build-service-runtime.py --profile release --destination artifacts/runtime/${{ matrix.target }}
      - name: Seal the exact runtime handoff
        if: steps.resume.outputs.restored != 'true'
        run: python scripts/ci-runtime.py seal --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }} --transfer artifacts/runtime-transfer/${{ matrix.target }}
      - name: Retain build output for validation and same-run reruns
        if: steps.resume.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-runtime-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/runtime-transfer/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Summarize build phase durations and slow tests
        if: always()
        run: python scripts/ci-metrics.py summary
      - name: Record runner capacity after a build failure
        if: failure()
        run: python scripts/ci-diagnostics.py --output artifacts/ci/runner-failure.json
      - name: Retain build timing evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-ci-build-timings-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7
  native:
    needs: [plan, native-build]
    if: ${{ !cancelled() && needs.plan.outputs.native == 'true' && needs.native-build.result == 'success' }}
    name: Native / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.native_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes || 90 }}
    env:
      AIRK_QUALIFICATION: ${{ inputs.qualification || false }}
      AIRK_PROCESS_DIAGNOSTICS: '1'
      AIRK_NATIVE_DIAGNOSTIC_DIR: ${{ github.workspace }}/artifacts/ci/native-failures
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Restore locked extension build tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - name: Install pinned compiler for package provenance (no native compilation)
        run: rustup show
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-runtime-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/runtime-transfer/${{ matrix.target }}
      - name: Verify source and complete payload before executing the transferred runtime
        run: python scripts/ci-runtime.py restore --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }} --transfer artifacts/runtime-transfer/${{ matrix.target }}
      - name: Record runner capacity before native validation
        run: python scripts/ci-diagnostics.py --output artifacts/ci/runner-before.json
      # TODO(split 10.5.2, harness row): `airk` is service-only. Inventory each consumer below
      # as service, CLI or matched pair: check-service-clients.py, check-service-install.py and
      # the --binary harnesses (check-transformer-model, benchmark-code, check-retrieval-quality,
      # check-document-tables, check-storage-lifecycle, check-usage-inputs,
      # check-publication-faults) still drive user commands through matrix.executable (airk);
      # they need the airkctl path (or --runtime-dir) per scripts/ci-plan.py NATIVE_ROWS, which
      # has no airkctl column yet. AIRK_TEST_BINARY below also points at airk, and
      # packages/vscode/src/test/nativeSmoke.test.ts was removed in Phase 6, so the MCP smoke
      # step has no test file until an airkctl session smoke replaces it.
      - name: Native direct clients, retained reads and shared offline inference
        run: python scripts/check-service-clients.py --runtime-dir artifacts/runtime/${{ matrix.target }} --files 16 --model --report artifacts/benchmarks/${{ matrix.target }}-clients.json
      - name: Installed process roles and client lifetime
        run: python scripts/check-service-install.py --runtime artifacts/runtime/${{ matrix.target }}
      - name: Real embedded model indexing and vector retrieval
        if: ${{ inputs.qualification }}
        run: python scripts/check-transformer-model.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
      - name: Bounded code indexing correctness and measurement smoke
        if: ${{ inputs.qualification }}
        run: python scripts/benchmark-code.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }} --files 64 --output artifacts/benchmarks/${{ matrix.target }}.json
      - name: Persistent retrieval ranking and scoped recall receipts
        if: ${{ inputs.qualification }}
        run: python scripts/check-retrieval-quality.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }} --output artifacts/benchmarks/${{ matrix.target }}-retrieval.json
      - name: DOCX and XLSX table indexing through the public CLI
        run: python scripts/check-document-tables.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
      - name: Source aliases and storage quota lifecycle through the public CLI
        if: ${{ inputs.qualification }}
        run: python scripts/check-storage-lifecycle.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
      - name: Validate usage imports and calibration
        if: ${{ inputs.qualification }}
        run: python scripts/check-usage-inputs.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
      - name: Abrupt process termination preserves a coherent published revision
        if: ${{ inputs.qualification }}
        run: python scripts/check-publication-faults.py --binary artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }} --attempts 3 --output artifacts/benchmarks/${{ matrix.target }}-faults.json
      - name: Full extension and native lifecycle qualification
        if: ${{ inputs.qualification }}
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
        run: npm test --prefix packages/vscode
      - name: Managed MCP smoke and cold-client regression repetitions
        shell: bash
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/artifacts/runtime/${{ matrix.target }}/${{ matrix.executable }}
        # One full routine pass. Preserve three cold-client observations until
        # the corrected cold setup path is qualified; qualification repeats all.
        # Each failed command stops the step; no failed pass is retried.
        run: |
          # Qualification's full suite above already supplies its first pass.
          if [ "$AIRK_QUALIFICATION" != "true" ]; then
            npm run compile --prefix packages/vscode
            python scripts/ci-metrics.py run --name mcp-smoke-1 -- node --test packages/vscode/out/test/nativeSmoke.test.js
          fi
          for pass in 2 3; do
            if [ "$AIRK_QUALIFICATION" = "true" ]; then
              python scripts/ci-metrics.py run --name "mcp-smoke-$pass" -- node --test packages/vscode/out/test/nativeSmoke.test.js
            else
              python scripts/ci-metrics.py run --name "cold-clients-$pass" -- node --test --test-name-pattern '^four cold HTTPS (sequential|concurrent) clients observe first status without diagnostic warmup$' packages/vscode/out/test/nativeSmoke.test.js
            fi
          done
      - name: Package and verify allowlisted native payload
        run: python scripts/package-native.py --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }}
      # The VSIX is universal and UI-only (U29); the extension job packages it once without
      # native bytes. A universal VSIX never replaces this per-target native evidence.
      - name: Retain native candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain code measurement report
        if: ${{ inputs.qualification }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-code-measurements-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/benchmarks/${{ matrix.target }}.json
            artifacts/benchmarks/${{ matrix.target }}-faults.json
            artifacts/benchmarks/${{ matrix.target }}-retrieval.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize phase durations and slow tests
        if: always()
        run: python scripts/ci-metrics.py summary
      - name: Record runner capacity after a native validation failure
        if: failure()
        run: python scripts/ci-diagnostics.py --output artifacts/ci/runner-failure.json
      - name: Retain timing evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-ci-timings-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Validation reuses the transferred runtime; nextest never runs here.
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 7
  container:
    needs: [plan, quick]
    if: needs.plan.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Create isolated BuildKit builder
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Restore and save trusted dependency mounts
        if: ${{ !inputs.fresh_build && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/docker-cache
          key: airk-docker-deps-v3-linux-x64-${{ hashFiles('Dockerfile', 'rust-toolchain.toml', 'scripts/ci-prune-target.py') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            airk-docker-deps-v3-linux-x64-${{ hashFiles('Dockerfile', 'rust-toolchain.toml', 'scripts/ci-prune-target.py') }}-
      - name: Restore dependency mounts without writing PR caches
        if: ${{ !inputs.fresh_build && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/docker-cache
          key: airk-docker-deps-v3-linux-x64-${{ hashFiles('Dockerfile', 'rust-toolchain.toml', 'scripts/ci-prune-target.py') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            airk-docker-deps-v3-linux-x64-${{ hashFiles('Dockerfile', 'rust-toolchain.toml', 'scripts/ci-prune-target.py') }}-
      - name: Persist the actual Cargo cache mounts
        if: ${{ !inputs.fresh_build }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "artifacts/docker-cache/registry": {"target": "/usr/local/cargo/registry", "id": "airk-cargo-registry"},
              "artifacts/docker-cache/git": {"target": "/usr/local/cargo/git", "id": "airk-cargo-git"},
              "artifacts/docker-cache/target": {"target": "/build/target", "id": "airk-linux-target"}
            }
          skip-extraction: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || steps.docker-cache.outputs.cache-hit == 'true' }}
      - name: Container build-cache ownership regression
        # A small real-container check covers cache replacement and root-owned
        # imports before the expensive build. It runs no duplicate Rust suites.
        run: python scripts/check-container-build-cache.py
      - name: Build runtime image (workspace tests are opt-in)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: smoke
          build-args: AIRK_QUALIFICATION=${{ inputs.qualification && 'true' || 'false' }}
          load: true
          tags: airk:dev
          cache-from: ${{ !inputs.fresh_build && 'type=gha,scope=airk-container-v2' || '' }}
          cache-to: ${{ !inputs.fresh_build && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=airk-container-v2' || '' }}
      - name: One-container collection smoke test
        run: python scripts/check-container.py --image airk:dev
      - name: Export container phase and test timings
        run: docker buildx build --build-arg AIRK_QUALIFICATION=${{ inputs.qualification && 'true' || 'false' }} --target report --output type=local,dest=artifacts/container-ci .
      - name: Summarize container measurements
        run: python scripts/ci-metrics.py summary --file artifacts/container-ci/timings.jsonl --junit artifacts/container-ci/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-container-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/container-ci/
          retention-days: 7
  required:
    name: Required checks
    # Keep PR and feature-ref cancellation fail-closed: a skipped required job
    # can satisfy branch protection, including a manually dispatched PR-head run.
    # Only canceled non-PR main runs skip redundant failure aggregation.
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || !cancelled()) }}
    needs: [plan, quick, contracts, extension, native, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require exactly the checks selected by the complete diff
        env:
          AIRK_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci-plan.py gate
