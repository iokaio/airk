# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        type: string
        default: preview
      expected_version:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  native:
    name: Native / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: airk
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: airk.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: airk
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: airk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned compiler and checks
        run: rustup show
      - name: Restore Rust dependencies and compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            target/debug
            target/release
            target/${{ matrix.target }}/debug
            target/${{ matrix.target }}/release
          key: airk-rust-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml', '.cargo/**') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            airk-rust-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/ci.yml', '.cargo/**') }}-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Restore locked extension build tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - name: Check release version when requested
        env:
          AIRK_EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node -e "const p=require('./packages/vscode/package.json'); const v=process.env.AIRK_EXPECTED_VERSION; if(v && p.version!==v) throw Error('Requested version differs from package.json')"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Packaging contract tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - run: git diff --check
      - name: Build pinned native candidate
        run: cargo build --release --locked -p airk-cli --target ${{ matrix.target }}
      - name: Bounded code indexing correctness and measurement smoke
        run: python scripts/benchmark-code.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --files 64 --output artifacts/benchmarks/${{ matrix.target }}.json
      - name: DOCX and XLSX table indexing through the public CLI
        run: python scripts/check-document-tables.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Source aliases and storage quota lifecycle through the public CLI
        run: python scripts/check-storage-lifecycle.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Validate usage imports and calibration
        run: python scripts/check-usage-inputs.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Abrupt process termination preserves a coherent published revision
        run: python scripts/check-publication-faults.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --attempts 3 --output artifacts/benchmarks/${{ matrix.target }}-faults.json
      - name: Extension contracts and real native MCP adapter
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: npm test --prefix packages/vscode
      - name: Package and verify allowlisted native payload
        run: python scripts/package-native.py --target ${{ matrix.target }}
      - name: Package and verify platform VSIX
        env:
          AIRK_CHANNEL: ${{ inputs.channel || 'preview' }}
        shell: pwsh
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel $env:AIRK_CHANNEL
      - name: Retain native candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain code measurement report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-code-measurements-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/benchmarks/${{ matrix.target }}.json
            artifacts/benchmarks/${{ matrix.target }}-faults.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain matching extension and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test Linux container build stage
        run: docker build --target test -t airk:local-test .
      - run: docker compose build
      - name: One-container collection smoke test
        run: python scripts/check-container.py --image airk:dev
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [native, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform and container check
        env:
          AIRK_NATIVE_RESULT: ${{ needs.native.result }}
          AIRK_CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$AIRK_NATIVE_RESULT" = success && test "$AIRK_CONTAINER_RESULT" = success
