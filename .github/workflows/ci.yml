# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-natural-exit-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-proof:
    name: Native regression proof / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            jobs: 2
            executable: AIRK.app/Contents/MacOS/airk
          - os: macos-15-intel
            target: x86_64-apple-darwin
            jobs: 4
            executable: AIRK.app/Contents/MacOS/airk
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            jobs: 4
            executable: airk.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      AIRK_TEST_MODEL_DIR: ${{ github.workspace }}/target/local-vector-model
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      AIRK_PROCESS_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        timeout-minutes: 8
        with:
          shared-key: native-${{ matrix.target }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: 'false'
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.148
      - name: Natural exit and descendant ownership regressions
        run: cargo nextest run --profile ci -p airk-process --locked --target ${{ matrix.target }}
      - name: Prepare pinned bundled model build inputs
        run: python scripts/provision-local-model.py --destination target/local-vector-model --download
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - name: Build lightweight debug runtime pair for actual managed installation
        env:
          # Preserve normal debug behavior while avoiding repeated hashing of debug symbols.
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: python scripts/build-service-runtime.py --destination artifacts/proof-runtime --profile debug
      - name: Extension contracts and actual managed native installation
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/artifacts/proof-runtime/${{ matrix.executable }}
        run: npm test --prefix packages/vscode
