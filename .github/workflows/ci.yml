# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
jobs:
  native:
    name: Native / ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: airk
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: airk.exe
          - os: macos-15
            target: aarch64-apple-darwin
            executable: airk
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: airk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned compiler and checks
        run: rustup show
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Restore locked extension build tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Packaging contract tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - run: git diff --check
      - name: Build pinned native candidate
        run: cargo build --release --locked -p airk-cli --target ${{ matrix.target }}
      - name: Bounded code indexing correctness and measurement smoke
        run: python scripts/benchmark-code.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --files 64 --output artifacts/benchmarks/${{ matrix.target }}.json
      - name: Extension contracts and real native MCP adapter
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: npm test --prefix packages/vscode
      - name: Package and verify allowlisted native payload
        run: python scripts/package-native.py --target ${{ matrix.target }}
      - name: Package and verify platform VSIX
        run: python scripts/package-extension.py --target ${{ matrix.target }}
      - name: Retain native candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain code measurement report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-code-measurements-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmarks/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain matching extension and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: docker compose build
      - name: One-container collection smoke test
        run: python scripts/check-container.py --image airk:dev
