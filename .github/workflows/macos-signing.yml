# SPDX-License-Identifier: Apache-2.0
name: Signed macOS candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airk-macos-signing
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
jobs:
  signed:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: rustup show
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: python -m unittest discover -s scripts/tests -v
      - name: Repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
      - run: git diff --check
      - run: cargo build --release --locked -p airk-cli --target ${{ matrix.target }}
      - name: Extension contracts and real native MCP adapter
        env:
          AIRK_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/airk
        run: npm test --prefix packages/vscode
      - name: Sign and notarize using an isolated temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/ci-macos-sign.py --target ${{ matrix.target }}
      - name: Remove temporary signing credentials even after failure
        if: ${{ always() }}
        run: python scripts/ci-macos-sign.py --cleanup
      - name: Package and reverify signed native candidate
        run: python scripts/package-native.py --target ${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }}
      - name: Package matching preview VSIX
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel preview
      - name: Retain signed native candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain matching VSIX with signed helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
