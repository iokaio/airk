# SPDX-License-Identifier: Apache-2.0
# Advisory checks for the locked Cargo and npm graphs. Separate from routine CI:
# it runs only when lockfiles or the policy change, weekly, and on request.
name: Dependency audit
on:
  pull_request:
    paths:
      - Cargo.lock
      - packages/vscode/package-lock.json
      - .cargo/audit-exceptions.json
      - scripts/dependency-audit.py
      - .github/workflows/dependency-audit.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - packages/vscode/package-lock.json
      - .cargo/audit-exceptions.json
      - scripts/dependency-audit.py
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Policy tests
        run: python -m unittest scripts/tests/test_dependency_audit.py -v
      # Reads lockfiles only; installs nothing and runs no project or dependency code.
      # Exit 1 is an undisposed finding; exit 2 is a scanner/network failure, not a pass.
      - name: Audit locked dependencies
        run: python scripts/dependency-audit.py
