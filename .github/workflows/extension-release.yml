# SPDX-License-Identifier: Apache-2.0
name: Extension release
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional successful manual CI run on this exact main commit
        type: string
        default: ''
      version:
        description: Exact checked-in extension version (for example 0.2.1)
        type: string
        required: true
      channel:
        description: Marketplace release channel
        type: choice
        options: [preview, stable]
        default: preview
      publish:
        description: Publish the verified packages to Visual Studio Marketplace
        type: boolean
        default: false
      verify_identity:
        description: Check Entra login and report the Marketplace member ID without building or publishing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: airk-extension-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publication requires the protected main branch
        env:
          AIRK_PUBLISH: ${{ inputs.publish }}
          AIRK_VERIFY_IDENTITY: ${{ inputs.verify_identity }}
          AIRK_REF: ${{ github.ref }}
          AIRK_VERSION: ${{ inputs.version }}
        run: |
          if [ "$AIRK_REF" != refs/heads/main ]; then
            echo 'Candidate promotion and Marketplace identity access require protected main.' >&2
            exit 1
          fi
          if [ "$AIRK_PUBLISH" = true ] && [ "$AIRK_VERIFY_IDENTITY" = true ]; then
            echo 'Identity verification and publication are separate operations.' >&2
            exit 1
          fi
          [[ "$AIRK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ !inputs.verify_identity }}
        with:
          persist-credentials: false
      - name: Select tested main artifacts and verify requested version
        if: ${{ !inputs.verify_identity }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          AIRK_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import json, os; assert json.load(open("packages/vscode/package.json"))["version"] == os.environ["AIRK_VERSION"]'
          python scripts/ci-candidates.py resolve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.verify_identity }}
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/producer.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  verify-identity:
    if: ${{ inputs.verify_identity }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate the Marketplace publisher identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Report Marketplace member ID without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          profile_id=$(az rest --method get \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)
          [[ "$profile_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          printf 'Marketplace member ID: %s\n' "$profile_id"
          printf 'Marketplace member ID: `%s`\n\nAdd this ID to publisher **iokaio** with the **Contributor** role. This check does not verify publisher membership or publish an extension.\n' "$profile_id" >> "$GITHUB_STEP_SUMMARY"
  build:
    if: ${{ !inputs.verify_identity }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: npm run compile --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Authenticate and restore the tested native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py download --target ${{ matrix.target }} --output artifacts/native/${{ matrix.target }}/publish
      - name: Repackage the selected channel without compiling native code
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel "$AIRK_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - name: Authenticate the Marketplace publisher identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: airk-vsix-*-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release
          merge-multiple: false
      - name: Verify complete platform set, payloads, version and source provenance
        env:
          AIRK_COMMIT: ${{ github.sha }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/verify-extension-release.py --directory artifacts/release --commit "$AIRK_COMMIT" --version "$AIRK_VERSION" --channel "$AIRK_CHANNEL" --output artifacts/verified-vsix.json
      - name: Publish verified VSIX packages using Microsoft Entra
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          AZURE_TENANT_ID: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
        run: node packages/vscode/scripts/publish.cjs artifacts/verified-vsix.json "$AIRK_CHANNEL"
