# SPDX-License-Identifier: Apache-2.0
name: Extension release
on:
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: Successful GitHub release rehearsal or publication on this exact main commit and channel
        type: string
        default: ''
      version:
        description: Exact checked-in native and extension version
        type: string
        required: true
      channel:
        description: Marketplace release channel
        type: choice
        options: [stable, preview]
        default: stable
      publish:
        description: Publish the verified packages to Visual Studio Marketplace
        type: boolean
        default: false
      verify_identity:
        description: Check Entra login and report the Marketplace member ID without building or publishing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: airk-release-publication
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.version.outputs.action }}
    steps:
      - name: Publication requires the protected main branch
        env:
          AIRK_PUBLISH: ${{ inputs.publish }}
          AIRK_VERIFY_IDENTITY: ${{ inputs.verify_identity }}
          AIRK_REF: ${{ github.ref }}
          AIRK_VERSION: ${{ inputs.version }}
        run: |
          if [ "$AIRK_REF" != refs/heads/main ]; then
            echo 'Candidate promotion and Marketplace identity access require protected main.' >&2
            exit 1
          fi
          if [ "$AIRK_PUBLISH" = true ] && [ "$AIRK_VERIFY_IDENTITY" = true ]; then
            echo 'Identity verification and publication are separate operations.' >&2
            exit 1
          fi
          [[ "$AIRK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ !inputs.verify_identity }}
        with:
          persist-credentials: false
      - name: Select an unused version or finish the existing release
        if: ${{ !inputs.verify_identity }}
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$AIRK_PUBLISH" = true ]; then args+=(--publish); fi
          python scripts/release-version.py plan --destination marketplace --channel "$AIRK_CHANNEL" "${args[@]}"
      - name: Pin the canonical signed native and VSIX producer
        if: ${{ !inputs.verify_identity && (steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse') }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
        run: |
          python -c 'import json, os; assert json.load(open("packages/vscode/package.json"))["version"] == os.environ["AIRK_VERSION"]'
          python scripts/ci-candidates.py signed-release --run-id "$AIRK_SIGNED_RUN_ID" --record artifacts/signed-producer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        with:
          name: airk-signed-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signed-producer.json
          if-no-files-found: error
          retention-days: 7

  version-pr:
    needs: preflight
    if: ${{ inputs.publish && !inputs.verify_identity && needs.preflight.outputs.action == 'bump' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the next patch for human review and main CI
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release-version.py prepare-pr --destination marketplace --channel "$AIRK_CHANNEL" --publish

  verify-identity:
    if: ${{ inputs.verify_identity }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate the Marketplace publisher identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Report Marketplace member ID without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          profile_id=$(az rest --method get \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv)
          [[ "$profile_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          printf 'Marketplace member ID: %s\n' "$profile_id"
          printf 'Marketplace member ID: `%s`\n\nAdd this ID to publisher **iokaio** with the **Contributor** role. This check does not verify publisher membership or publish an extension.\n' "$profile_id" >> "$GITHUB_STEP_SUMMARY"
  build:
    if: ${{ !inputs.verify_identity && (needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse') }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-signed-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Revalidate and copy the exact signed producer packages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/ci-candidates.py signed-release-download --record artifacts/signed-producer.json --version "$AIRK_VERSION" --channel "$AIRK_CHANNEL" --output artifacts/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-marketplace-verified-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: ${{ !cancelled() && inputs.publish && needs.preflight.outputs.action == 'publish' && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-signed-producer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Reauthenticate the same signed assembly before granting bytes to the publisher
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/ci-candidates.py signed-release-download --record artifacts/signed-producer.json --version "$AIRK_VERSION" --channel "$AIRK_CHANNEL" --output artifacts/release --published-only
      - name: Verify complete platform set, payloads, version and source provenance
        env:
          AIRK_COMMIT: ${{ github.sha }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/verify-extension-release.py --directory artifacts/release --commit "$AIRK_COMMIT" --version "$AIRK_VERSION" --channel "$AIRK_CHANNEL" --output artifacts/verified-vsix.json
      - name: Authenticate the Marketplace publisher identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish verified VSIX packages using Microsoft Entra
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          AZURE_TENANT_ID: ${{ vars.AZURE_MARKETPLACE_TENANT_ID }}
        run: |
          python scripts/release-version.py pending --destination marketplace --channel "$AIRK_CHANNEL" --publish --inventory artifacts/verified-vsix.json --output artifacts/unpublished-vsix.json
          node packages/vscode/scripts/publish.cjs artifacts/unpublished-vsix.json "$AIRK_CHANNEL"
      - name: Verify all four Marketplace downloads match the authenticated signed packages
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_VERSION: ${{ inputs.version }}
        run: python scripts/release-version.py verify-published --destination marketplace --channel "$AIRK_CHANNEL" --publish --inventory artifacts/verified-vsix.json
