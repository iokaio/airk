# SPDX-License-Identifier: Apache-2.0
name: Extension release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact checked-in extension version (for example 0.2.1)
        type: string
        required: true
      channel:
        description: Marketplace release channel
        type: choice
        options: [preview, stable]
        default: preview
      publish:
        description: Publish the verified packages to Visual Studio Marketplace
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: airk-extension-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publication requires the protected main branch
        env:
          AIRK_PUBLISH: ${{ inputs.publish }}
          AIRK_REF: ${{ github.ref }}
          AIRK_VERSION: ${{ inputs.version }}
        run: |
          if [ "$AIRK_PUBLISH" = true ] && [ "$AIRK_REF" != refs/heads/main ]; then
            echo 'Publish from protected main only.' >&2
            exit 1
          fi
          [[ "$AIRK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
  build:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      channel: ${{ inputs.channel }}
      expected_version: ${{ inputs.version }}
  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: airk-vsix-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
          merge-multiple: false
      - name: Verify complete platform set, payloads, version and source provenance
        env:
          AIRK_COMMIT: ${{ github.sha }}
          AIRK_VERSION: ${{ inputs.version }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/verify-extension-release.py --directory artifacts/release --commit "$AIRK_COMMIT" --version "$AIRK_VERSION" --channel "$AIRK_CHANNEL" --output artifacts/verified-vsix.json
      - name: Publish verified VSIX packages using Marketplace trusted publishing
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: node packages/vscode/scripts/publish.cjs artifacts/verified-vsix.json "$AIRK_CHANNEL"
