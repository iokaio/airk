# SPDX-License-Identifier: Apache-2.0
name: Downloads page
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-downloads.py
      - scripts/tests/test_downloads_site.py
      - .github/workflows/downloads.yml
permissions:
  contents: read
concurrency:
  group: airk-downloads-page
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'iokaio/airk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -p test_downloads_site.py -v
      - name: Generate direct downloads from published AIRK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build-downloads.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/downloads-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish AIRK's downloads page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
