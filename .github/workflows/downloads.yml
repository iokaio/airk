# SPDX-License-Identifier: Apache-2.0
name: Downloads page
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Campaign only - successful exact manual CI producer
        type: string
        default: ''
      qualified_sha:
        description: Campaign only - exact final-qualified source SHA
        type: string
        default: ''
  workflow_call:
    inputs:
      candidate_run_id:
        type: string
        default: ''
      qualified_sha:
        type: string
        default: ''

  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-downloads.py
      - scripts/help-site.py
      - scripts/check-published-help.py
      - scripts/tests/test_published_help.py
      - scripts/tests/test_help_site.py
      - scripts/tests/help-site-browser.cjs
      # Shared release-catalog dependency read by build-downloads.py.
      - scripts/standalone-installer-contract.py
      - scripts/split_receipts.py
      - scripts/publication-contract.py
      - fixtures/split/receipts/publication_2.json
      - scripts/tests/test_downloads_site.py
      - .github/workflows/downloads.yml
env:
  AIRK_QUALIFIED_SHA: ${{ inputs.qualified_sha }}
permissions:
  contents: read
  actions: read
concurrency:
  group: airk-downloads-page
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'iokaio/airk' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/advanced-split' && github.event_name == 'workflow_dispatch' && inputs.qualified_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # Reusable workflows carry the caller's github context. Accept only this
      # downloads workflow or its canonical release caller on the exact SHA.
      - name: Verify campaign downloads caller
        if: ${{ github.ref == 'refs/heads/feat/advanced-split' }}
        run: python scripts/release-authority.py context --workflow downloads.yml --workflow github-release.yml
      - name: Authenticate complete campaign CI before website deployment
        if: ${{ github.ref == 'refs/heads/feat/advanced-split' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python scripts/ci-candidates.py resolve --record artifacts/site-producer.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
      - name: Verify downloads and published Help boundaries
        run: |
          python -m unittest discover -s scripts/tests -p test_downloads_site.py -v
          python -m unittest discover -s scripts/tests -p test_help_site.py -v
          python -m unittest discover -s scripts/tests -p test_published_help.py -v
      # Split releases (§9.4): Install AIRK Service, then Install VS Code Extension (one universal
      # VSIX); each asset is advertised only when its GitHub digest matches the release's own
      # release.json, which build-downloads.py downloads and checks first.
      - name: Generate direct downloads from published AIRK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build-downloads.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/downloads-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish AIRK's downloads page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
