# SPDX-License-Identifier: Apache-2.0
name: GitHub release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-release.yml
      - scripts/github-release.py
      - scripts/ci-*-sign.py
      - scripts/tests/test_github_release.py
      - scripts/tests/test_ci_*_signing.py
  workflow_dispatch:
    inputs:
      channel:
        description: GitHub release and VSIX channel
        type: choice
        options: [preview, stable]
        default: preview
      publish:
        description: Publish signed downloads to GitHub Releases after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: airk-github-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate release and signing contracts without credentials
        run: |
          python -m unittest discover -s scripts/tests -p test_github_release.py -v
          python -m unittest discover -s scripts/tests -p 'test_ci_*_signing.py' -v
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Bind main commit, package version and automatic build number
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py preflight
  build:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      channel: ${{ inputs.channel }}
      expected_version: ${{ needs.preflight.outputs.version }}
      fresh_build: true
  sign:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            environment: native-signing
          - os: macos-15
            target: aarch64-apple-darwin
            environment: macos-signing
          - os: macos-15-intel
            target: x86_64-apple-darwin
            environment: macos-signing
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: rustup show
      - run: cargo fetch --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: npm run compile --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tested-native
      - name: Verify and restore only this run's tested executable
        run: python scripts/github-release.py stage-signing --directory artifacts/tested-native --target ${{ matrix.target }}
      - name: Stage Windows signing copy
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py prepare
      - name: Authenticate AIRK's environment through Azure OIDC
        id: azure
        if: runner.os == 'Windows'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows helper using Ioka's existing Azure profile
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: ioka-llc-signing
          certificate-profile-name: WritingForgePro
          files: ${{ github.workspace }}\artifacts\signed\x86_64-pc-windows-msvc\airk.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Windows trust, publisher, identity EKU and timestamp
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py record
      - name: Clear Azure login
        if: always() && runner.os == 'Windows' && steps.azure.outcome == 'success'
        run: az logout
      - name: Sign and notarize Mac helper in an isolated keychain
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/ci-macos-sign.py --target ${{ matrix.target }}
      - name: Remove temporary Apple credentials after any failure
        if: always() && runner.os == 'macOS'
        run: python scripts/ci-macos-sign.py --cleanup
      - name: Reverify signature and package the signed native copy
        run: python scripts/package-native.py --target ${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }}
      - name: Repackage matching VSIX with the signed helper
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        shell: pwsh
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel $env:AIRK_CHANNEL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  assemble:
    needs: [preflight, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: airk-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidates
          merge-multiple: false
      - name: Verify complete signed platform set and stage public downloads
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/github-release.py assemble --directory artifacts/candidates --output artifacts/github-release --channel "$AIRK_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: inputs.publish
    needs: assemble
    runs-on: ubuntu-24.04
    environment: github-releases
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-release
      - name: Upload draft, verify server-side digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py publish --directory artifacts/github-release
  downloads:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/downloads.yml
