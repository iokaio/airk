# SPDX-License-Identifier: Apache-2.0
name: GitHub release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-release.yml
      - scripts/github-release.py
      - scripts/ci-*-sign.py
      - scripts/tests/test_github_release.py
      - scripts/tests/test_ci_*_signing.py
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional successful manual CI run on this exact main commit; otherwise select main push CI
        type: string
        default: ''
      channel:
        description: GitHub release and VSIX channel
        type: choice
        options: [stable, preview]
        default: stable
      publish:
        description: Publish signed downloads to GitHub Releases after verification
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: airk-release-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate release and signing contracts without credentials
        run: |
          python -m unittest discover -s scripts/tests -p test_github_release.py -v
          python -m unittest discover -s scripts/tests -p 'test_ci_*_signing.py' -v
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      action: ${{ steps.version.outputs.action }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select an unused version or finish the existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$AIRK_PUBLISH" = true ]; then args+=(--publish); fi
          python scripts/release-version.py plan --destination github --channel "$AIRK_CHANNEL" "${args[@]}"
      - name: Bind main commit and clean package-version tag
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py preflight
      - name: Select and authenticate the tested main candidate
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python scripts/ci-candidates.py resolve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/producer.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  version-pr:
    needs: preflight
    if: ${{ inputs.publish && needs.preflight.outputs.action == 'bump' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the next patch for human review and main CI
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release-version.py prepare-pr --destination github --channel "$AIRK_CHANNEL" --publish

  sign:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            environment: native-signing
          - os: macos-15
            target: aarch64-apple-darwin
            environment: macos-signing
          - os: macos-15-intel
            target: x86_64-apple-darwin
            environment: macos-signing
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: rustup show
      - run: cargo fetch --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: npm run compile --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Authenticate and download the exact producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py download --target ${{ matrix.target }} --output artifacts/tested-native
      - name: Verify and restore only the producer's tested executable
        run: python scripts/github-release.py stage-signing --directory artifacts/tested-native --target ${{ matrix.target }}
      - name: Stage Windows signing copy
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py prepare
      - name: Authenticate AIRK's environment through Azure OIDC
        id: azure
        if: runner.os == 'Windows'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows helper using Ioka's existing Azure profile
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: ioka-llc-signing
          certificate-profile-name: WritingForgePro
          files: ${{ github.workspace }}\artifacts\signed\x86_64-pc-windows-msvc\airk.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Windows trust, publisher, identity EKU and timestamp
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py record
      - name: Clear Azure login
        if: always() && runner.os == 'Windows' && steps.azure.outcome == 'success'
        run: az logout
      - name: Sign and notarize Mac helper in an isolated keychain
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python scripts/ci-macos-sign.py --target ${{ matrix.target }}
      - name: Remove temporary Apple credentials after any failure
        if: always() && runner.os == 'macOS'
        run: python scripts/ci-macos-sign.py --cleanup
      - name: Reverify signature and package the signed native copy
        run: python scripts/package-native.py --target ${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }}
      - name: Repackage matching VSIX with the signed helper
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        shell: pwsh
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel $env:AIRK_CHANNEL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-native-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/native/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-vsix-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/extension/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  package-linux:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
      - run: npm run compile --prefix packages/vscode
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Restore the unchanged tested Linux native package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py download --target x86_64-unknown-linux-gnu --output artifacts/native/x86_64-unknown-linux-gnu/publish
      - name: Package the selected VSIX channel with the tested Linux helper
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/package-extension.py --target x86_64-unknown-linux-gnu --channel "$AIRK_CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-native-x86_64-unknown-linux-gnu-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/native/x86_64-unknown-linux-gnu/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-vsix-x86_64-unknown-linux-gnu-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/extension/x86_64-unknown-linux-gnu/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  assemble:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: [preflight, sign, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Restore authenticated original native packages for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py download --output artifacts/candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: airk-*-*-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/candidates
          merge-multiple: false
      - name: Verify complete signed platform set and stage public downloads
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py assemble --directory artifacts/candidates --output artifacts/github-release --channel "$AIRK_CHANNEL" --producer artifacts/producer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: ${{ inputs.publish && needs.preflight.outputs.action == 'publish' }}
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    environment: github-releases
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Restore the verified assembly from this run, including earlier successful attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py bundle --output artifacts/github-release
      - name: Resume matching draft, verify server digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py publish --directory artifacts/github-release --resume

  downloads:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/downloads.yml
