# SPDX-License-Identifier: Apache-2.0
name: GitHub release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-release.yml
      - scripts/github-release.py
      - scripts/ci-*-sign.py
      - scripts/sign-native.py
      - scripts/package-standalone-*.py
      - scripts/standalone-installer-contract.py
      - installers/**
      - scripts/tests/test_standalone_*.py
      - scripts/tests/test_github_release.py
      - scripts/tests/test_ci_*_signing.py
      - scripts/tests/test_native_signing.py
      - scripts/tests/test_package_standalone_linux.py
      # Published-release reader used by release-version.py plan --destination github.
      - scripts/build-downloads.py
      - scripts/tests/test_downloads_site.py
      # Release assembly owners shared with the split catalog: candidate selection, VSIX channel
      # promotion and verification, signed native repackaging and Marketplace version planning.
      - scripts/ci-candidates.py
      - scripts/promote-vsix.py
      - scripts/verify-extension-release.py
      - scripts/package-native.py
      - scripts/release-version.py
      - scripts/tests/test_ci_candidates.py
      - scripts/tests/test_release_promotion.py
      - scripts/tests/test_release_version.py
      - scripts/tests/test_extension_release.py
      # Split release-tool inputs (split §10.5.2): receipt/catalog owner, signing identity and
      # the admin identity bound into native receipts.
      - scripts/split_receipts.py
      - scripts/tests/test_split_receipts.py
      - fixtures/split/receipts/**
      - scripts/signing-identity.json
      - scripts/build-admin-assets.py
      - packages/admin/**
      - crates/airk-cli/admin-assets/**
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Optional successful manual CI run on this exact main commit; otherwise select main push CI
        type: string
        default: ''
      channel:
        description: GitHub release and VSIX channel
        type: choice
        options: [stable, preview]
        default: stable
      publish:
        description: Publish signed downloads to GitHub Releases after verification
        type: boolean
        default: false
      repair_1_4_4:
        description: Reuse only 1.4.4 source 3c64111b and successful CI 40369075574 after release-tool repair
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: airk-release-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate release and signing contracts without credentials
        run: |
          python -m unittest discover -s scripts/tests -p test_github_release.py -v
          python -m unittest discover -s scripts/tests -p test_release_1_4_4_repair.py -v
          python -m unittest discover -s scripts/tests -p 'test_ci_*_signing.py' -v
          python -m unittest discover -s scripts/tests -p 'test_standalone_*.py' -v
          python -m unittest discover -s scripts/tests -p test_split_receipts.py -v
          python -m unittest discover -s scripts/tests -p test_ci_candidates.py -v
          python -m unittest discover -s scripts/tests -p test_release_promotion.py -v
          python -m unittest discover -s scripts/tests -p test_release_version.py -v
          python -m unittest discover -s scripts/tests -p test_extension_release.py -v
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.repair.outputs.version || steps.identity.outputs.version }}
      tag: ${{ steps.repair.outputs.tag || steps.identity.outputs.tag }}
      action: ${{ steps.repair.outputs.action || steps.version.outputs.action }}
      source_commit: ${{ steps.repair.outputs.source_commit || github.sha }}
      # 'true' selects the split catalog: per-target native pair, one universal VSIX (split §10.5.4).
      split: ${{ steps.identity.outputs.split || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ inputs.repair_1_4_4 && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select an unused version or finish the existing release
        if: ${{ !inputs.repair_1_4_4 }}
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$AIRK_PUBLISH" = true ]; then args+=(--publish); fi
          python scripts/release-version.py plan --destination github --channel "$AIRK_CHANNEL" "${args[@]}"
      - name: Authenticate the pinned 1.4.4 source and reviewed tooling repair
        if: ${{ inputs.repair_1_4_4 }}
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_PUBLISH: ${{ inputs.publish }}
          AIRK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python scripts/release-1.4.4-repair.py preflight
      - name: Bind main commit and clean package-version tag
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github-release.py preflight
      - name: Select and authenticate the tested main candidate
        if: ${{ steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: python scripts/ci-candidates.py resolve
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.repair.outputs.action != '' || steps.version.outputs.action == 'publish' || steps.version.outputs.action == 'rehearse' }}
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/producer.json
            artifacts/repair.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  version-pr:
    needs: preflight
    if: ${{ inputs.publish && needs.preflight.outputs.action == 'bump' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare the next patch for human review and main CI
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/release-version.py prepare-pr --destination github --channel "$AIRK_CHANNEL" --publish

  sign:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            environment: native-signing
          - os: macos-15
            target: aarch64-apple-darwin
            environment: macos-signing
          - os: macos-15-intel
            target: x86_64-apple-darwin
            environment: macos-signing
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    timeout-minutes: 45
    env:
      AIRK_RELEASE_SOURCE_ROOT: ${{ inputs.repair_1_4_4 && 'artifacts/repair-source' || '.' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.repair_1_4_4 && '0' || '1' }}
      - name: Restore the pinned clean source separately from release tooling
        if: ${{ inputs.repair_1_4_4 }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: artifacts/repair-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ inputs.repair_1_4_4 }}
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: rustup show
        if: ${{ inputs.repair_1_4_4 }}
      - run: cargo fetch --locked
        if: ${{ inputs.repair_1_4_4 }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
        if: ${{ inputs.repair_1_4_4 }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - run: npm run compile --prefix packages/vscode
        if: ${{ inputs.repair_1_4_4 }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Authenticate and download the exact producer artifact
        if: ${{ inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'ci-candidates.py' }} download --target ${{ matrix.target }} --output artifacts/tested-native
      # Split versions: the producer has one universal VSIX and no per-target VSIX, so the
      # source record binds the tested airk-native-candidate/3 pair alone; package-linux
      # promotes the universal VSIX once. Pre-split versions keep the platform-VSIX path.
      - name: Download pinned native and compiled VSIX artifacts
        shell: bash
        if: ${{ !inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_SPLIT: ${{ needs.preflight.outputs.split }}
        run: |
          python scripts/ci-candidates.py download --pinned --target ${{ matrix.target }} --output artifacts/tested-native
          if [ "$AIRK_SPLIT" = true ]; then
            python scripts/github-release.py source-record --directory artifacts/tested-native --target ${{ matrix.target }} --producer artifacts/producer.json --output artifacts/source/${{ matrix.target }}
          else
            python scripts/ci-candidates.py download --pinned --kind vsix --target ${{ matrix.target }} --output artifacts/tested-vsix
            python scripts/promote-vsix.py source --native artifacts/tested-native --vsix artifacts/tested-vsix --target ${{ matrix.target }} --output artifacts/source/${{ matrix.target }}
          fi
      - name: Verify and restore only the producer's tested executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'github-release.py' }} stage-signing --directory artifacts/tested-native --target ${{ matrix.target }}
      # Split versions (§9.4, §10.5.4): the Windows (ci-windows-sign.py prepare/list/record) and macOS
      # pair signing steps below sign and verify both airk and airkctl
      # (build-service-runtime.py signing_names; airk-service-pair-signing/1 with both components and
      # schema-3 pair metadata); macOS signs the nested images, then seals and notarizes AIRK.app.
      # package-standalone-windows.py stages the §9.5 layout and compiles airk-service.iss in the same
      # prepare/build/record order; earlier versions keep airk.iss and their single/legacy payloads.
      - name: Stage Windows signing copy
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py prepare --pair
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - name: Select exact versioned Windows signing components
        id: signing_components
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py list --runtime-dir "${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/signed/${{ matrix.target }}/runtime"
      - name: Authenticate AIRK's environment through Azure OIDC
        id: azure
        if: runner.os == 'Windows'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows runtime using Ioka's existing Azure profile
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: ioka-llc-signing
          certificate-profile-name: WritingForgePro
          files: ${{ steps.signing_components.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Windows trust, publisher, identity EKU and timestamp
        if: runner.os == 'Windows'
        run: python scripts/ci-windows-sign.py record --pair
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - name: Prepare the standalone Windows uninstaller from the signed native payload
        if: ${{ runner.os == 'Windows' && !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        run: python scripts/package-standalone-windows.py prepare --runtime-dir artifacts/runtime/${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }}
      - name: Sign the standalone Windows uninstaller with the existing Azure profile
        if: ${{ runner.os == 'Windows' && !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: ioka-llc-signing
          certificate-profile-name: WritingForgePro
          files: artifacts/standalone/${{ matrix.target }}/uninstaller.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify and embed the signed Windows uninstaller
        if: ${{ runner.os == 'Windows' && !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        run: python scripts/package-standalone-windows.py build
      - name: Sign the standalone Windows installer with the existing Azure profile
        if: ${{ runner.os == 'Windows' && !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wus2.codesigning.azure.net
          signing-account-name: ioka-llc-signing
          certificate-profile-name: WritingForgePro
          files: artifacts/standalone/${{ matrix.target }}/airk-${{ needs.preflight.outputs.version }}-${{ matrix.target }}-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify the standalone Windows installer and uninstaller
        if: ${{ runner.os == 'Windows' && !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        run: python scripts/package-standalone-windows.py record
      - name: Clear Azure login
        if: always() && runner.os == 'Windows' && steps.azure.outcome == 'success'
        run: az logout
      - name: Use TCP for Apple ticket requests on Mac runners
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-ticket-network
      - name: Sign and notarize Mac helper in an isolated keychain
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          AIRK_STANDALONE_INSTALLER: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        run: python scripts/ci-macos-sign.py --target ${{ matrix.target }} --pair
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - name: Remove temporary Apple credentials after any failure
        if: always() && runner.os == 'macOS'
        run: python scripts/ci-macos-sign.py --cleanup
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - name: Reverify signature and package the signed native copy
        if: ${{ inputs.repair_1_4_4 }}
        run: python scripts/package-native.py --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - name: Repackage matching VSIX with the signed helper
        if: ${{ inputs.repair_1_4_4 }}
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        shell: pwsh
        run: python scripts/package-extension.py --target ${{ matrix.target }} --channel $env:AIRK_CHANNEL
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      # Split versions package only the signed native pair here (airk-native-candidate/3); the
      # universal VSIX is never re-packaged per target. Pre-split versions splice the signed
      # payload into their platform VSIX.
      - name: Package signed bytes using CI metadata and compiled extension
        if: ${{ !inputs.repair_1_4_4 }}
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_SPLIT: ${{ needs.preflight.outputs.split }}
        shell: pwsh
        run: |
          python scripts/package-native.py --target ${{ matrix.target }} --runtime-dir artifacts/runtime/${{ matrix.target }} --signed-dir artifacts/signed/${{ matrix.target }} --source-manifest artifacts/tested-native/manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:AIRK_SPLIT -ne 'true') {
            python scripts/promote-vsix.py package --native artifacts/native/${{ matrix.target }}/publish --original artifacts/tested-native --vsix artifacts/tested-vsix --target ${{ matrix.target }} --channel $env:AIRK_CHANNEL --output artifacts/extension/${{ matrix.target }}/publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        with:
          name: airk-installer-${{ matrix.target }}-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/standalone/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.repair_1_4_4 }}
        with:
          name: airk-source-${{ matrix.target }}-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/source/${{ matrix.target }}/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-signed-native-${{ matrix.target }}-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/native/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # Pre-split only: split versions have no per-target signed VSIX (split_receipts.catalog_names).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.preflight.outputs.split != 'true' }}
        with:
          name: airk-signed-vsix-${{ matrix.target }}-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/extension/${{ matrix.target }}/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  package-linux:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRK_RELEASE_SOURCE_ROOT: ${{ inputs.repair_1_4_4 && 'artifacts/repair-source' || '.' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.repair_1_4_4 && '0' || '1' }}
      - name: Restore the pinned clean source separately from release tooling
        if: ${{ inputs.repair_1_4_4 }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: artifacts/repair-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ inputs.repair_1_4_4 }}
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix packages/vscode
        if: ${{ inputs.repair_1_4_4 }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - run: npm run compile --prefix packages/vscode
        if: ${{ inputs.repair_1_4_4 }}
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Restore the unchanged tested Linux native package
        if: ${{ inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'ci-candidates.py' }} download --target x86_64-unknown-linux-gnu --output ${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/native/x86_64-unknown-linux-gnu/publish
      - name: Package the selected VSIX channel with the tested Linux helper
        if: ${{ inputs.repair_1_4_4 }}
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
        run: python scripts/package-extension.py --target x86_64-unknown-linux-gnu --channel "$AIRK_CHANNEL"
        working-directory: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}
      # Split versions promote the unchanged Linux native pair here and the producer's one
      # universal VSIX once for the whole release: `promote-vsix.py channel` rewrites only its
      # pre-release property. Pre-split versions promote the Linux platform VSIX instead.
      - name: Promote unchanged Linux CI packages (adjust channel only when requested)
        if: ${{ !inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
          AIRK_CHANNEL: ${{ inputs.channel }}
          AIRK_SPLIT: ${{ needs.preflight.outputs.split }}
        run: |
          python scripts/ci-candidates.py download --pinned --target x86_64-unknown-linux-gnu --output artifacts/native/x86_64-unknown-linux-gnu/publish
          if [ "$AIRK_SPLIT" = true ]; then
            python scripts/github-release.py source-record --directory artifacts/native/x86_64-unknown-linux-gnu/publish --target x86_64-unknown-linux-gnu --producer artifacts/producer.json --output artifacts/source/x86_64-unknown-linux-gnu
            python scripts/ci-candidates.py download --pinned --kind vsix --output artifacts/tested-vsix
            set -- artifacts/tested-vsix/airk-vsix-universal-*
            if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
              echo 'Expected exactly one authenticated universal VSIX from the producer.' >&2
              exit 1
            fi
            python scripts/promote-vsix.py channel --vsix "$1" --channel "$AIRK_CHANNEL" --output artifacts/extension/universal/publish
          else
            python scripts/ci-candidates.py download --pinned --kind vsix --target x86_64-unknown-linux-gnu --output artifacts/tested-vsix
            python scripts/promote-vsix.py source --native artifacts/native/x86_64-unknown-linux-gnu/publish --vsix artifacts/tested-vsix --target x86_64-unknown-linux-gnu --output artifacts/source/x86_64-unknown-linux-gnu
            python scripts/promote-vsix.py package --native artifacts/native/x86_64-unknown-linux-gnu/publish --vsix artifacts/tested-vsix --target x86_64-unknown-linux-gnu --channel "$AIRK_CHANNEL" --output artifacts/extension/x86_64-unknown-linux-gnu/publish
          fi
      - name: Package the offline standalone Linux CLI installer
        if: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        run: python scripts/package-standalone-linux.py --native-dir artifacts/native/x86_64-unknown-linux-gnu/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        with:
          name: airk-installer-x86_64-unknown-linux-gnu-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/standalone/x86_64-unknown-linux-gnu/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.repair_1_4_4 }}
        with:
          name: airk-source-x86_64-unknown-linux-gnu-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/source/x86_64-unknown-linux-gnu/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-native-x86_64-unknown-linux-gnu-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/native/x86_64-unknown-linux-gnu/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.preflight.outputs.split != 'true' }}
        with:
          name: airk-vsix-x86_64-unknown-linux-gnu-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: ${{ env.AIRK_RELEASE_SOURCE_ROOT }}/artifacts/extension/x86_64-unknown-linux-gnu/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # The release's one universal VSIX input (split_receipts.catalog_names `release_inputs`).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.preflight.outputs.split == 'true' }}
        with:
          name: airk-vsix-universal-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/extension/universal/publish/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  assemble:
    if: ${{ needs.preflight.outputs.action == 'publish' || needs.preflight.outputs.action == 'rehearse' }}
    needs: [preflight, sign, package-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.repair_1_4_4 && '0' || '1' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Restore authenticated original native packages for comparison
        if: ${{ inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'ci-candidates.py' }} download --output artifacts/candidates
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.repair_1_4_4 }}
        with:
          pattern: airk-*-*-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/candidates
          merge-multiple: false
      - name: Authenticate and download this release's outputs and source receipts
        if: ${{ !inputs.repair_1_4_4 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py release-inputs --output artifacts/candidates
      - name: Restore this run's verified standalone installer outputs
        if: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: airk-installer-*-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: artifacts/candidates
          merge-multiple: false
      # Split versions also compare the release's universal VSIX with the producer's tested one;
      # this authenticates the pinned producer artifact by id and digest (split §10.5.4).
      - name: Authenticate and download the producer's tested universal VSIX
        if: ${{ !inputs.repair_1_4_4 && needs.preflight.outputs.split == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-candidates.py download --pinned --kind vsix --output artifacts/candidates
      # Split assembly (github-release.py assemble_split): per target the signed (Linux: promoted)
      # airk + airkctl pair with its admin identity and the installer, plus one airk-<version>.vsix.
      - name: Verify complete signed platform set and stage public downloads
        env:
          AIRK_CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ inputs.repair_1_4_4 }}" != true ]; then args+=(--pinned-producer --source-records); fi
          python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'github-release.py' }} assemble --directory artifacts/candidates --output artifacts/github-release --channel "$AIRK_CHANNEL" --producer artifacts/producer.json "${args[@]}"
      - name: Attest the final GitHub-hosted VSIX bytes
        if: ${{ !inputs.repair_1_4_4 }}
        id: vsix_attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: artifacts/github-release/*.vsix
          create-storage-record: false
      - name: Attest the final standalone Linux installer bytes
        if: ${{ !inputs.repair_1_4_4 && inputs.channel == 'stable' }}
        id: linux_attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: artifacts/github-release/airk-${{ needs.preflight.outputs.version }}-x86_64-unknown-linux-gnu-installer.tar.gz
          create-storage-record: false
      - name: Retain the verification bundles separately from the immutable release asset set
        if: ${{ !inputs.repair_1_4_4 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-release-attestations-${{ needs.preflight.outputs.source_commit }}-${{ github.run_id }}
          path: |
            ${{ steps.vsix_attestation.outputs.bundle-path }}
            ${{ steps.linux_attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: ${{ inputs.publish && needs.preflight.outputs.action == 'publish' }}
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    environment: github-releases
    permissions:
      contents: write
      actions: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.repair_1_4_4 && '0' || '1' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.repair_1_4_4 }}
        with:
          name: airk-producer-${{ github.sha }}-${{ github.run_id }}
          path: artifacts
      - name: Restore the verified assembly from this run, including earlier successful attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'ci-candidates.py' }} bundle --output artifacts/github-release
      - name: Resume matching draft, verify server digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/${{ inputs.repair_1_4_4 && 'release-1.4.4-repair.py' || 'github-release.py' }} publish --directory artifacts/github-release --resume

  downloads:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/downloads.yml
