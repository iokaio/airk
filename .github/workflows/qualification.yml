# SPDX-License-Identifier: Apache-2.0
name: Extended qualification
on:
  workflow_dispatch:
    inputs:
      files:
        description: Original scale fixture file count (2 to 100000; 8192 bytes each)
        type: string
        default: '16384'
      command_timeout_seconds:
        description: Per-command scale deadline (1 to 5400 seconds; job limit remains 90 minutes)
        type: string
        default: '1800'
      public_corpus:
        description: Download and index the pinned public CPython source release
        type: boolean
        default: false
      transformer:
        description: Download and qualify the pinned Apache-2.0 MiniLM model
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: airk-extended-qualification-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            executable: airk
          - os: windows-2025
            executable: airk.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare pinned bundled model build inputs
        run: python scripts/provision-local-model.py --destination target/local-vector-model --download
      - name: Build the verified separate native runtime pair
        run: python scripts/build-service-runtime.py --destination artifacts/qualification/runtime --profile release
      - name: Fixed corpus scale and optional pinned public repository
        shell: pwsh
        env:
          AIRK_FILES: ${{ inputs.files }}
          AIRK_COMMAND_TIMEOUT: ${{ inputs.command_timeout_seconds }}
          AIRK_PUBLIC_CORPUS: ${{ inputs.public_corpus }}
          AIRK_BINARY: artifacts/qualification/runtime/${{ matrix.executable }}
        run: |
          $airkArguments = @('scripts/benchmark-scale.py', '--binary', $env:AIRK_BINARY, '--files', $env:AIRK_FILES, '--command-timeout-seconds', $env:AIRK_COMMAND_TIMEOUT, '--output', 'artifacts/qualification/scale')
          if ($env:AIRK_PUBLIC_CORPUS -eq 'true') { $airkArguments += '--cpython' }
          python @airkArguments
          if ($LASTEXITCODE -ne 0) { throw 'Scale qualification failed' }
      - name: Abrupt process termination and atomic recovery
        run: python scripts/check-publication-faults.py --binary artifacts/qualification/runtime/${{ matrix.executable }} --output artifacts/qualification/process-faults.json
      - name: Provision pinned model only when explicitly selected
        if: ${{ inputs.transformer }}
        run: python scripts/provision-local-model.py --destination artifacts/qualification/model --download
      - name: Qualify real transformer publication and retrieval
        if: ${{ inputs.transformer }}
        run: python scripts/check-transformer-model.py --binary artifacts/qualification/runtime/${{ matrix.executable }} --model-dir artifacts/qualification/model --report artifacts/qualification/transformer.json
      - name: Retain numeric qualification reports only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airk-qualification-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification/scale/report.json
            artifacts/qualification/process-faults.json
            artifacts/qualification/transformer.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
